<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiorna Jolly</title><body style="font:18px system-ui;background:#fff8f9;color:#311323;padding:8%;max-width:650px;margin:auto"><h1>La nuova Jolly ti aspetta.</h1><p>Se vedi ancora la vecchia versione, aggiorna i file salvati dal sito sul dispositivo. Il tuo account e gli ordini restano al loro posto.</p><button id="update" style="border:0;border-radius:40px;padding:18px 25px;background:#e52c58;color:white;font:inherit;cursor:pointer">Apri la nuova versione</button><p id="status" role="status"></p><script>
document.getElementById('update').onclick=async function(){this.disabled=true;try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>new URL(r.scope).origin===location.origin).map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('jolly-')).map(k=>caches.delete(k)));}location.replace('/?version=7');}catch(e){document.getElementById('status').textContent='Apri il sito in una finestra privata e riprova.';this.disabled=false;}};
</script></body></html>
